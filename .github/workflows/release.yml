name: Release

on:
  pull_request:    
  # Uncomment to enable scheduled releases.
  # schedule:
  #   # 2 AM on Sunday
  #   - cron: "0 2 * * 0"
  workflow_dispatch:

# we do not want more than one release workflow executing at the same time, ever
concurrency:
  group: release
  # cancelling in the middle of a release would create incomplete releases
  # so cancel-in-progress is false
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  id-token: write
  statuses: write

jobs:
  release:
    if: github.repository == 'substrait-io/substrait-go'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:          
          fetch-depth: 0
      - name: Run go-semantic-release  
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}         
        run: |          
          wget https://github.com/Nightapes/go-semantic-release/releases/download/v2.1.1/go-semantic-release.linux_x86_64.zip
          unzip go-semantic-release.linux_x86_64.zip
          ./go-semantic-release.linux_x86_64 release -l trace
      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Release codec
        # codec is versioned in lockstep with core: tag codec/vX.Y.Z for every
        # core release vX.Y.Z. The release commit lives only under the tag.
        run: |
          git fetch --tags --force
          version=$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "no core release at HEAD; skipping codec"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release-codec.sh "$version"
          git push origin "codec/$version"
